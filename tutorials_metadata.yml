# Central fallback metadata for tutorials that haven't migrated their own
# frontmatter yet (see MIGRATION_PLAN.md, task 1).
#
# Every tutorial's own README.md frontmatter is the source of truth. This
# file only fills in fields a tutorial does not define itself. Once a
# tutorial defines a field upstream, `generate-tutorial-data.rb` will
# print a build warning suggesting to remove the field here.
#
# Keyed by the same "owner/repo" string used in the `tutorials:` list in
# _config.yml.
#
# Supported fields (mirrors tutorials/tutorial_schema.yml):
#   beastversion_tutorial   - BEAST2 version the tutorial was written/tested with
#   workflow                - one of tutorial_schema.yml's `workflows`
#   status                  - one of tutorial_schema.yml's `status_values`
#   keywords                - list, 3-10 entries recommended
#   packages                - list of BEAST2 package names
#   domains                 - list of application domains
#   beastversion_package    - most recent BEAST2 version supporting the packages
#
# ---------------------------------------------------------------------------

taming-the-beast/Introduction-to-BEAST2:
