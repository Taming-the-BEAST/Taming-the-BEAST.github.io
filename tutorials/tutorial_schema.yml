# Application domains
domains:
  - epidemiology
  - phylogeography
  - palaeontology
  - population genetics
  - language evolution
  - macroevolution
  - single-cell

# Required fields
required_fields:
  - author
  - title
  - beastversion_tutorial    # BEAST2 version the tutorial was written/tested with
  - workflow
  - status

# Recommended fields
recommended_fields:
  - subtitle
  - keywords
  - packages
  - beastversion_package     # Most recent BEAST2 version supporting the package (auto-populated from CBAN)
  - tracerversion
  - figtreeversion
  
# Optional fields
optional_fields:
  - domains
  - deprecated_reason
  - deprecated_alternative
  - related_tutorials
  - prerequisites
  - estimated_time

# Validation rules
validation_rules:
  keywords:
    min: 3              # min number of keywords
    max: 10             # max number of keywords
  packages:
    min: 0
    max: 5
  deprecated:
    requires:           # If status is "deprecated", these fields are required
      - deprecated_reason
